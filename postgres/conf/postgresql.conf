# Tuning conservador. La VM corre n8n + caddy + estos containers; no es
# un host dedicado a Postgres. Ajustar si el footprint de los agentes
# crece y se vuelve un cuello de botella.

listen_addresses = '*'
port = 5432

# Memoria
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 64MB

# Conexiones
max_connections = 50

# WAL — defaults razonables para carga ligera con escrituras esporádicas
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Logging — captura queries lentas para diagnóstico
log_min_duration_statement = 500ms
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# Localización
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
